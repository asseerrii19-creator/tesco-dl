{% extends "base.html" %}
{% block title %}{{ portal_title }} — TSCO Platform{% endblock %}
{% block public_content %}
<div class="login-shell login-shell-single">
  <section class="login-card login-card-final">
    <a class="back-link" href="/welcome">← Back</a>
    <span class="eyebrow">TSCO DIGITAL LABORATORY PLATFORM</span>
    <h1>{{ portal_title }}</h1>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login/{{ portal }}" class="stack">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
  </section>
</div>
{% endblock %}
