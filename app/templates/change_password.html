{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="narrow-panel panel">
  <h1>Change Password</h1>
  <p>Temporary passwords must be replaced before operational use.</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  {% if ok %}<div class="alert success">{{ ok }}</div>{% endif %}
  <form method="post" class="stack">
    <label>Current password<input type="password" name="current_password" required></label>
    <label>New password<input type="password" name="new_password" minlength="10" required></label>
    <label>Confirm new password<input type="password" name="confirm_password" minlength="10" required></label>
    <button>Update password</button>
  </form>
</div>
{% endblock %}
